<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不具合報告 KPI ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#94a3b8;
  --blue:#3b82f6; --green:#10b981; --red:#ef4444; --amber:#f59e0b; --navy:#1e3a5f;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;}
.topbar h1{font-size:17px;font-weight:700;}
.badge{background:#e0e7ff;color:#3730a3;font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;}
.topbar .spacer{flex:1;}
.src-note{font-size:11px;color:var(--muted);}
button.btn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
button.btn.light{background:#fff;color:var(--text);border:1px solid var(--border);}
button.btn:hover{opacity:.85;}
.wrap{padding:16px 20px;max-width:1600px;margin:0 auto;}
.banner{display:none;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.kpi .label{font-size:12px;color:#64748b;margin-bottom:6px;}
.kpi .value{font-size:26px;font-weight:800;line-height:1.1;}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px;}
.kpi .value.blue{color:var(--blue);} .kpi .value.green{color:var(--green);}
.kpi .value.red{color:var(--red);} .kpi .value.amber{color:var(--amber);}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;}
.filters .f{display:flex;flex-direction:column;gap:4px;}
.filters label{font-size:11px;color:#64748b;font-weight:600;}
.filters select,.filters input{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;background:#fff;min-width:140px;}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.panel h3{font-size:13px;font-weight:700;margin-bottom:10px;}
.chartbox{position:relative;height:280px;}
.panel.table-panel{overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:8px;color:#64748b;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
tr:hover td{background:#f8fafc;}
td a{color:var(--blue);text-decoration:none;font-weight:600;}
td a:hover{text-decoration:underline;}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.st.done{background:#d1fae5;color:#065f46;}
.st.wip{background:#fef3c7;color:#92400e;}
.st.hold{background:#e0e7ff;color:#3730a3;}
.st.open{background:#fee2e2;color:#991b1b;}
.st.na{background:#f1f5f9;color:#64748b;}
.note-cell{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#475569;}
.num{text-align:right;white-space:nowrap;}
.count-note{font-size:11px;color:var(--muted);margin-left:8px;font-weight:400;}
@media(max-width:1000px){.grid,.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar">
  <h1>🔧 不具合報告 KPI ダッシュボード</h1>
  <span class="badge">DAMD 品質管理</span>
  <div class="spacer"></div>
  <span class="src-note" id="srcNote">読み込み中…</span>

</div>
<div class="wrap">
  <div class="banner" id="banner"></div>

  <div class="kpis">
    <div class="kpi"><div class="label">総報告件数</div><div class="value" id="kTotal">–</div><div class="sub" id="kTotalSub"></div></div>
    <div class="kpi"><div class="label">要対応（未対応＋対応中＋保留）</div><div class="value red" id="kOpen">–</div><div class="sub" id="kOpenSub"></div></div>
    <div class="kpi"><div class="label">完了率</div><div class="value green" id="kRate">–</div><div class="sub" id="kRateSub"></div></div>
    <div class="kpi"><div class="label">実工数 合計</div><div class="value blue" id="kHours">–</div><div class="sub">シート「累計実工数」列の合計 ※4月分は連番入力の疑いあり</div></div>
    <div class="kpi"><div class="label">代品費用合計（費用＋送料）</div><div class="value amber" id="kCost">–</div><div class="sub" id="kCostSub"></div></div>
    <div class="kpi"><div class="label">平均完了リードタイム</div><div class="value" id="kLead">–</div><div class="sub" id="kLeadSub"></div></div>
  </div>

  <div class="filters">
    <div class="f"><label>期間（月）自</label><select id="fFrom"></select></div>
    <div class="f"><label>期間（月）至</label><select id="fTo"></select></div>
    <div class="f"><label>ステータス</label><select id="fStatus"><option value="">すべて</option></select></div>
    <div class="f"><label>車種</label><select id="fCar"><option value="">すべて</option></select></div>
    <div class="f"><label>製品グループ</label><select id="fProd"><option value="">すべて</option></select></div>
    <div class="f"><label>症状</label><select id="fSym"><option value="">すべて</option></select></div>
    <div class="f"><label>キーワード検索</label><input id="fText" type="text" placeholder="氏名・会社・内容など"></div>
    <button class="btn light" id="btnReset">リセット</button>
  </div>

  <div class="grid">
    <div class="panel"><h3>月別 報告件数の推移（ステータス内訳）</h3><div class="chartbox"><canvas id="cMonth"></canvas></div></div>
    <div class="panel"><h3>ステータス構成</h3><div class="chartbox"><canvas id="cStatus"></canvas></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>症状別 件数</h3><div class="chartbox"><canvas id="cSym"></canvas></div></div>
    <div class="panel"><h3>製品グループ別 件数（Top 10）</h3><div class="chartbox"><canvas id="cProd"></canvas></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>車種別 件数（Top 10）</h3><div class="chartbox"><canvas id="cCar"></canvas></div></div>
    <div class="panel"><h3>月別 代品費用（費用＋送料）</h3><div class="chartbox"><canvas id="cCost"></canvas></div></div>
  </div>

  <div class="panel table-panel">
    <h3>報告明細 <span class="count-note" id="tblCount"></span></h3>
    <div style="max-height:480px;overflow:auto;">
      <table>
        <thead><tr><th>受付日</th><th>ステータス</th><th>車種</th><th>製品</th><th>症状</th><th>発生時期</th><th class="num">工数h</th><th class="num">代品費用</th><th>報告者</th><th>内容</th></tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>
</div>

/* ================= CSVパース ================= */
function parseCSV(text){
  const rows=[]; let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(field); field=""; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(ch!=='\r') field+=ch;
    }
  }
  if(field!==""||row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ================= 正規化 ================= */
function money(s){ if(typeof s==="number")return s; return parseFloat(String(s||"").replace(/[¥￥,\s]/g,""))||0; }
function parseDate(s){
  s=(s||"").trim(); if(!s) return null;
  const m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(!m) return null;
  return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
}
function parseShort(s, base){
  s=(s||"").trim(); if(!s) return null;
  let m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m||!base) return null;
  let y=base.getFullYear();
  let d=new Date(y,+m[1]-1,+m[2],+m[3],+m[4],+(m[5]||0));
  if(d<base) d=new Date(y+1,+m[1]-1,+m[2],+m[3],+m[4],+(m[5]||0));
  return d;
}
function statusGroup(st){
  st=(st||"").trim();
  if(!st) return "未設定";
  if(st.includes("未対応")) return "未対応";
  if(st.includes("対応中")&&!st.includes("完了")) return "対応中";
  if(st.includes("保留")) return "保留";
  if(st.includes("完了")) return "完了";
  return "その他";
}
function normCar(s){
  s=(s||"").replace(/\s+/g," ").trim();
  if(!s) return "未記入";
  const u=s.normalize("NFKC").toUpperCase().replace(/[ー－\-・\s]/g,"");
  if(u.includes("ノマド")) return "ジムニーノマド";
  if(u.includes("シエラ")) return "ジムニーシエラ";
  if(u.includes("ジムニ")) return "ジムニー";
  if(u.includes("WRX")) return "WRX STI";
  if(u.includes("WRV")) return "WR-V";
  if(u.includes("エブリ")||u.includes("EVERY")) return "エブリイ";
  if(u.includes("タフト")||u.includes("TAFT")) return "タフト";
  if(u.includes("STEP")||u.includes("ステップ")) return "ステップワゴン";
  if(u.includes("フリード")) return "フリード";
  if(u.includes("シエンタ")) return "シエンタ";
  if(u.includes("タウンエース")) return "タウンエース";
  if(u.includes("NVAN")) return "N-VAN";
  if(u.includes("ハスラー")) return "ハスラー";
  if(u.includes("スペーシア")||u.includes("SPACIA")) return "スペーシアギア";
  if(u.includes("デリカ")) return "デリカミニ";
  if(u.includes("アトレ")) return "アトレー";
  if(u.includes("ハイエース")) return "ハイエース";
  return s;
}
function normProd(s){
  s=(s||"").replace(/\s+/g," ").trim();
  if(!s) return "未記入";
  const u=s.normalize("NFKC").toLowerCase().replace(/[\s.・]/g,"");
  if(u.includes("reverb")||u.includes("リバーブ")) return "REVERB (WR-V)";
  if(u.includes("フェイスチェンジ")||u.includes("フェイスキット")) return "フェイスチェンジキット";
  if(u.includes("advance")||u.includes("アドバンス")) return "little G. ADVANCE";
  if(u.includes("littleg")||u.includes("リトルg")) return "little G. シリーズ";
  if(u.includes("littled")||u.includes("リトルd")||u.includes("リトルディー")||u==="littled") return "little D. シリーズ";
  if(u.includes("littleb")) return "little B.";
  if(u.includes("ルーフラック")||u.includes("tripbasket")) return "ルーフラック";
  if(u.includes("reso")||u.includes("レゾネーター")) return "RESONATOR";
  if(u.includes("denali")||u.includes("デナリ")) return "DENALI";
  if(u.includes("dali")) return "DALI";
  if(u.includes("lucky")) return "LUCKY";
  if(u.includes("stuart")||u.includes("スチュアート")) return "STUART";
  if(u.includes("isolator")||u.includes("アイソレータ")) return "ISOLATOR";
  if(u.includes("ホイール")) return "ホイール";
  if(u.includes("ウインカー")) return "ウインカーランプ";
  if(u.includes("バンパー")) return "バンパー";
  if(u.includes("グリル")) return "グリル";
  if(u.includes("テールランプ")) return "テールランプ";
  if(u.includes("ヘッドランプ")||u.includes("ヘッドライト")) return "ヘッドランプ";
  return s.length>18? s.slice(0,18)+"…" : s;
}
function splitSyms(s){
  const arr=(s||"").split(/[,、]/).map(x=>x.trim()).filter(Boolean);
  return arr.length?arr:["未分類"];
}

/* CSV/xlsx行 → レコード */
function rowToRec(r, link){
  const get=i=>(r[i]||"").trim();
  return makeRec(get(0),get(1),get(2),get(3),get(4),[get(5),get(6)].filter(Boolean).join(" / "),get(9),get(12),get(18),get(17),get(20),get(23),get(24),link||"");
}
function makeRec(d,f,c,h,st,nm,car,prod,sym,when,note,cost,ship,link){
  const date=parseDate(d);
  return {
    date, dateStr:(d||"").split(" ")[0],
    month: date? date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0") : "",
    first: parseShort(f,date), done: parseShort(c,date),
    hours: parseFloat(h)||0,
    stRaw:(st||"").replace(/\s+/g," ").trim(), st: statusGroup(st),
    name:nm||"", car: normCar(car), carRaw:(car||"").trim(),
    prod: normProd(prod), prodRaw:(prod||"").trim(),
    syms: splitSyms(sym), when:(when||"").replace(/\s+/g," ").trim(),
    note:(note||"").replace(/\s+/g," ").trim(),
    cost: money(cost)+money(ship),
    link: link||""
  };
}

const $=id=>document.getElementById(id);
function fillFilters(){
  const months=[...new Set(DATA.map(r=>r.month).filter(Boolean))].sort();
  const opt=(v,t)=>`<option value="${v}">${t||v}</option>`;
  $("fFrom").innerHTML=opt("","最初から")+months.map(m=>opt(m)).join("");
  $("fTo").innerHTML=opt("","最新まで")+months.map(m=>opt(m)).join("");
  const sts=["未対応","対応中","保留","完了","その他","未設定"].filter(s=>DATA.some(r=>r.st===s));
  $("fStatus").innerHTML=opt("","すべて")+sts.map(s=>opt(s)).join("");
  const cars=[...new Set(DATA.map(r=>r.car))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("fCar").innerHTML=opt("","すべて")+cars.map(c=>opt(c)).join("");
  const prods=[...new Set(DATA.map(r=>r.prod))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("fProd").innerHTML=opt("","すべて")+prods.map(p=>opt(p)).join("");
  const syms=[...new Set(DATA.flatMap(r=>r.syms))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("fSym").innerHTML=opt("","すべて")+syms.map(s=>opt(s)).join("");
}
function filtered(){
  const from=$("fFrom").value, to=$("fTo").value, st=$("fStatus").value,
        car=$("fCar").value, prod=$("fProd").value, sym=$("fSym").value,
        q=$("fText").value.trim().toLowerCase();
  return DATA.filter(r=>{
    if(from && r.month && r.month<from) return false;
    if(to && r.month && r.month>to) return false;
    if((from||to) && !r.month) return false;
    if(st && r.st!==st) return false;
    if(car && r.car!==car) return false;
    if(prod && r.prod!==prod) return false;
    if(sym && !r.syms.includes(sym)) return false;
    if(q){
      const hay=(r.name+" "+r.carRaw+" "+r.prodRaw+" "+r.note+" "+r.stRaw+" "+r.syms.join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function count(arr){const m={};arr.forEach(k=>m[k]=(m[k]||0)+1);return m;}

/* xlsx形式で取得（タイムスタンプセルの埋め込みリンクも抽出）。失敗時はCSV → 内蔵スナップショット */
async function loadXlsx(){
  const res=await fetch(SHEET_XLSX,{cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const wb=XLSX.read(await res.arrayBuffer(),{type:"array",cellDates:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const recs=[];
  for(let R=range.s.r;R<=range.e.r;R++){
    const row=[];
    for(let C=0;C<=Math.max(range.e.c,24);C++){
      const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      row.push(cell? (cell.w!==undefined? cell.w : String(cell.v??"")) : "");
    }
    if((row[0]||"").trim()==="タイムスタンプ") continue;
    if(!row.some(c=>(c||"").trim()!=="")) continue;
    const a=ws[XLSX.utils.encode_cell({r:R,c:0})];
    const link=(a&&a.l&&a.l.Target)||"";
    recs.push(rowToRec(row,link));
  }
  return recs;
}
async function loadCsv(){
  const res=await fetch(SHEET_CSV,{cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const rows=parseCSV(await res.text()).filter(r=>r.length>4);
  return rows.filter(r=>(r[0]||"").trim()!=="タイムスタンプ")
             .filter(r=>r.some(c=>(c||"").trim()!==""))
             .map(r=>rowToRec(r,""));
}
